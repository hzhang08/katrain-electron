<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self'; object-src 'none'; connect-src 'none'"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>KaTrain Electron</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas
      id="board"
      aria-label="KaTrain game and analysis interface"
      tabindex="0"
    ></canvas>
    <form id="move-navigation" aria-label="Go to move">
      <label for="move-number">Go to move</label>
      <input id="move-number" type="number" min="0" step="1" placeholder="86" required aria-describedby="move-feedback" />
      <button type="submit">Go</button>
      <span id="move-feedback" role="status" aria-live="polite"></span>
    </form>
    <textarea
      id="ime"
      aria-label="KaTrain text input"
      autocapitalize="off"
      spellcheck="false"
    ></textarea>
    <section id="status">
      <img class="app-icon" src="../assets/icon.svg" alt="KaTrain Electron logo" />
      <h1>KaTrain Electron</h1>
      <p id="message">Starting KaTrain and the analysis engine…</p>
      <button id="retry" hidden>Restart KaTrain</button>
    </section>
    <script src="renderer.js"></script>
  </body>
</html>
